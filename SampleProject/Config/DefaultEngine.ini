[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/SampleCatalog.SampleCatalogGameMode

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
; Custom Depth com stencil: OnFocusChanged liga SetRenderCustomDepth para um contorno via pós-processo.
r.CustomDepth=3

; UMG e Canvas escalam pela menor lateral (curva de DPI do projeto); Retina/HiDPI no Mac e Linux em jogo.
[/Script/Engine.UserInterfaceSettings]
UIScaleRule=ShortestSide
bAllowHighDPIInGameMode=True

; RHI por plataforma: Windows usa o padrão da engine (D3D12/D3D11); Mac = Metal, Linux = Vulkan.
[/Script/MacTargetPlatform.MacTargetSettings]
+TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
+TargetedRHIs=SF_VULKAN_SM5
