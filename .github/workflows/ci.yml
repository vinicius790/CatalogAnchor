# Gate host-side (Ubuntu, macOS e Windows): lint Python, validador (manifestos + C++ portável) e pytest com JUnit.
# Compilar o C++ e rodar os testes de automação exige Unreal Engine: ver ue.yml (runner self-hosted).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .

  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/validate_plugin.py
      - name: Docs de API em dia
        shell: bash
        run: |
          if [ -f tools/gen_api_docs.py ]; then python tools/gen_api_docs.py --check; else echo "gen_api_docs.py ausente: pulado"; fi

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # pytest==8.3.4 declara Requires-Python >=3.8 sem teto e roda em 3.14.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider --junitxml=reports/junit.xml tests/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/junit.xml
          if-no-files-found: warn
