# Release por tag `v*`: valida, testa, empacota Plugins/CatalogAnchor e publica com as notas do CHANGELOG.
# `tools/ue.py` não tem subcomando de pacote (build-plugin exige UE), então o zip sai de `git archive`
# (fonte do plugin, sem binários). A tag precisa bater com o VersionName do .uplugin.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_plugin.py
      - run: python -m pytest -q -p no:cacheprovider tests/

      - name: Conferir tag x VersionName
        run: |
          want="${GITHUB_REF_NAME#v}"
          want="${want%%-*}"  # v1.2.3-rc1 -> 1.2.3 (VersionName é só X.Y.Z; o sufixo marca pre-release)
          have=$(python -c "import json;print(json.load(open('Plugins/CatalogAnchor/CatalogAnchor.uplugin'))['VersionName'])")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME != VersionName $have"; exit 1; }

      - name: Extrair notas do CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0,h)==1{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md sem seção [$ver]"; exit 1; }

      - name: Empacotar plugin
        run: git archive --format=zip --prefix=CatalogAnchor/ -o "CatalogAnchor-$GITHUB_REF_NAME.zip" "$GITHUB_SHA:Plugins/CatalogAnchor"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "CatalogAnchor-$GITHUB_REF_NAME.zip" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
